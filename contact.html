<!doctype html>
<head>
  <title>contact us</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <!-- header iteams-->
  <header class="header">
    <div>
      <img class="header-logo" src="photos/MyWep_logo_108x46.png" />
    </div>
    <div class="header-links">
      <a href="about.html"> about </a>

      <a href="index.html"> index</a>

      <a href="contact.html"> contact</a>
    </div>
  </header>
  <!--contact us part-->
    <form class="contact">
        <h2>Contact Us</h2>
        <!--enter name-->
        <div>
         <label for="full name"> Full name </label>
         <input type="text" id="full name" placeholder=" name" name = "full name" required />
        </div>
        <!--enter email-->
        <div>
            <label for="email"> Email </label>
            <input type="email" id="email" placeholder="enter your email" name = "email" required />
        </div>
        <!--enter phone number-->
        <div>
            <label for="phone"> Phone Number</label>
            <input type="tel" id="phone" placeholder="enter your phone number" name = "phone" required />
        </div>
        <!-- date-->
        <div>
            <label for="date" > Date </label>
            <input id="date" type="date" placeholder="enter date" name="date" required/>

        </div>

        <!--radio-->
    
      <div>
        <h5>Prefeard Contact Method</h5>
        <div>
          <input id="mail" type="radio" value="mail" name="contact" />
          <label for="mail">Mail</label>
        </div>
        <div>
          <input id="phone" type="radio" value="phone" name="contact" />
          <label for="phone"> phone </label>
        </div>
      </div>
      <div>
         <!--  check box -->
        <h5> Interests </h5>
        <div>
            <input id="web dev" type="checkbox" value="web devolpment" name="interests">
            <label for="web dev" >web devolpment</label>
        </div>
        <div>
            <input id="UI" type="checkbox" value="UI&Ux" name="interests" >
            <label for="UI" >UI & UX</label>
        </div>
        <div>
            <input id="android app" type="checkbox" value="android app t" name="interests">
            <label for="android app" >android applecations</label>
        </div>
      </div> 
      <!--subject-->
      <div>
        <label for="dep" > depatement </label>
        <select id="dep" value="departement" required >
            <option value="IT"> customer support</option>
            <option value="sales">sales</option>
        </select>
      </div>
      <!--texet area-->
      <div>
        <textarea name ="text area" 
        rows="10"
         cols="35" 
         placeholder="type your massege"
         required 
        ></textarea>
      </div>

      <input type="submit" value="save your choice">

      
    </form>
  </div>
